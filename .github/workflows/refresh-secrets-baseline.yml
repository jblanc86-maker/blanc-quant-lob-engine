name: Refresh Detect-Secrets Baseline

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 03:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Update detect-secrets baseline
        run: |
          detect-secrets scan --exclude-files ".secrets.baseline" > .secrets.baseline.new
          if ! diff -q .secrets.baseline .secrets.baseline.new >/dev/null 2>&1; then
            mv .secrets.baseline.new .secrets.baseline
          else
            echo "No baseline changes"
            rm .secrets.baseline.new || true
          fi

      - name: Upload baseline proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detect-secrets-baseline-proposal-${{ github.run_id }}
          path: .secrets.baseline

name: Refresh Detect-Secrets Baseline

# Report-only. This job never writes to the repository: the branch ruleset
# rejects automated pushes to main by design (see PR #99). It regenerates the
# baseline, diffs it against the committed one, uploads the candidate as an
# artifact, and fails when drift is detected so a human opens the PR.

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Regenerate baseline candidate
        run: |
          detect-secrets scan --exclude-files ".secrets.baseline" > .secrets.baseline.candidate

      - name: Upload candidate baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-baseline-candidate
          path: .secrets.baseline.candidate
          retention-days: 14

      - name: Compare with committed baseline
        run: |
          # generated_at differs on every scan; compare results only.
          python3 - <<'PY'
          import json, sys
          old = json.load(open(".secrets.baseline"))
          new = json.load(open(".secrets.baseline.candidate"))
          if old.get("results") == new.get("results") and old.get("plugins_used") == new.get("plugins_used"):
              print("Baseline up to date.")
              sys.exit(0)
          print("::error::detect-secrets baseline drift detected. Download the "
                "'secrets-baseline-candidate' artifact, review it, and open a PR "
                "replacing .secrets.baseline. This job does not write to the repo.")
          sys.exit(1)
          PY

name: Refresh Detect-Secrets Baseline

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check 'detect-secrets==1.5.0'

      - name: Generate proposed baseline
        run: |
          set -euo pipefail
          detect-secrets scan --exclude-files '.secrets.baseline' > .secrets.baseline.proposed
          if cmp -s .secrets.baseline .secrets.baseline.proposed; then
            echo 'Baseline unchanged.'
          else
            echo 'Baseline changed; review the proposed artifact and update through a normal PR.'
          fi

      - name: Upload proposed baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detect-secrets-baseline-proposed-${{ github.run_id }}
          path: .secrets.baseline.proposed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

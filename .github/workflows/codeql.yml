name: "CodeQL Local Gate"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Local Gate (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild C/C++ for CodeQL extraction
        if: matrix.language == 'c-cpp'
        uses: github/codeql-action/autobuild@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4

      - name: Perform CodeQL Analysis locally
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: never

      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CodeQL findings policy
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sarif_files < <(find codeql-results -type f -name '*.sarif' -print0)
          if (( ${#sarif_files[@]} == 0 )); then
            echo 'No CodeQL SARIF output was produced; failing closed.' >&2
            exit 1
          fi

          findings=0
          for file in "${sarif_files[@]}"; do
            count=$(jq '[.runs[]?.results[]? | select((.suppressions // []) | length == 0)] | length' "$file")
            echo "$file: $count unsuppressed finding(s)"
            findings=$((findings + count))
          done

          if (( findings > 0 )); then
            echo "CodeQL policy failed with $findings unsuppressed finding(s)." >&2
            exit 1
          fi

          echo 'CodeQL local policy passed with zero unsuppressed findings.'

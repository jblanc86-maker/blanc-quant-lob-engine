name: Pin Actions Preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/pin_actions_by_shas.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/pin_actions_by_shas.sh'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate pin proposal only
        run: |
          set -euo pipefail
          chmod +x scripts/pin_actions_by_shas.sh
          ./scripts/pin_actions_by_shas.sh --dry-run --output-json pin_proposed.json

      - name: Upload pin proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-proposals-${{ github.run_id }}
          path: pin_proposed.json
          if-no-files-found: error
          retention-days: 14

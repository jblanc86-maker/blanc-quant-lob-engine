name: Update Performance Badge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-badge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update badge (example)
        run: |
          echo '{"performance": "updated"}' > badges/performance.json

      - name: Open PR with badge update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add badges/performance.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="auto/perf-badge-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "perf: update performance badge JSON"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "perf: update performance badge JSON" \
            --body "Automated performance badge refresh. Opened as a PR because main requires signed commits and status checks (direct push is blocked)." \
            || echo "PR already exists for $BRANCH"

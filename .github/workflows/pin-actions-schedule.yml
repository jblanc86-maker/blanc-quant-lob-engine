name: Pin Actions by SHA (Scheduled)

on:
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate scheduled pin proposal
        run: |
          set -euo pipefail
          chmod +x scripts/pin_actions_by_shas.sh
          ./scripts/pin_actions_by_shas.sh --dry-run --output-json pin_proposed.json

      - name: Upload pin proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-pin-proposals-${{ github.run_id }}
          path: pin_proposed.json
          if-no-files-found: error
          retention-days: 14

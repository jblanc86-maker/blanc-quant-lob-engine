name: Container Scan

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/container-scan.yml'
      - 'src/**'
      - 'include/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/container-scan.yml'
      - 'src/**'
      - 'include/**'
  schedule:
    - cron: '12 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build image (no push)
        run: docker build -t quant-lob-engine:ci .

      - name: Trivy filesystem JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: false
          exit-code: '0'
          format: 'json'
          output: 'trivy-fs.json'
          severity: 'CRITICAL,HIGH'

      - name: Trivy image SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'quant-lob-engine:ci'
          ignore-unfixed: false
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Trivy image JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'quant-lob-engine:ci'
          ignore-unfixed: false
          exit-code: '0'
          format: 'json'
          output: 'trivy-image.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-evidence-${{ github.run_id }}
          path: |
            trivy-fs.json
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Enforce HIGH/CRITICAL vulnerability policy
        run: |
          set -euo pipefail
          fs_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-fs.json)
          image_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-image.json)
          echo "Filesystem HIGH/CRITICAL findings: $fs_count"
          echo "Image HIGH/CRITICAL findings: $image_count"
          if (( fs_count > 0 || image_count > 0 )); then
            echo 'HIGH/CRITICAL vulnerability policy failed.' >&2
            exit 1
          fi
          echo 'Container vulnerability policy passed.'

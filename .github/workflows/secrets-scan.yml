name: Detect Secrets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'artifacts/**'
      - 'examples/**'
      - 'data/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'artifacts/**'
      - 'examples/**'
      - 'data/**'
      - '**/*.md'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: python3 -m pip install --disable-pip-version-check 'detect-secrets==1.5.0'

      - name: Require committed baseline
        run: test -s .secrets.baseline

      - name: Enforce no new secrets
        run: |
          set -euo pipefail
          git ls-files -z -- ':!.secrets.baseline' |
            xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Produce full scan record
        if: always()
        run: |
          mkdir -p artifacts
          python3 -m detect_secrets.main scan --all-files > artifacts/current-scan.json || true

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: secrets-scan-results-${{ github.run_id }}
          path: |
            .secrets.baseline
            artifacts/current-scan.json
          if-no-files-found: warn
          retention-days: 14
